name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn networkx pyyaml pytest ruff==0.17.5
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  optional-models:
    name: Tests with XGBoost, LightGBM and SHAP
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn networkx pyyaml pytest xgboost lightgbm shap
          pip install -e .
      - name: Test
        run: pytest -q -rs

  pipeline:
    name: Snakemake pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn networkx pyyaml "snakemake>=8.20,<9"
          pip install -e .
      - name: Dry run (all targets parse)
        run: snakemake --workflow-profile none --cores 1 -n all
      - name: Run demo pipeline
        run: snakemake --workflow-profile none --cores 2 all
      - name: Check determinism (second run from scratch gives identical outputs)
        run: |
          cp -r results/demo /tmp/first
          rm -rf results/demo data/processed/demo
          snakemake --workflow-profile none --cores 2 demo_all
          diff -r /tmp/first results/demo
      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            results/demo/
            results/tables/environment_check.txt
