name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyyaml pytest ruff
          pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  pipeline:
    name: Snakemake pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyyaml "snakemake>=8.20,<9"
          pip install -e .
      - name: Dry run
        run: snakemake --workflow-profile none --cores 1 -n all
      - name: Run demo pipeline
        run: snakemake --workflow-profile none --cores 1 all
      - name: Check determinism (second run from scratch gives identical output)
        run: |
          cp results/demo/cv_folds.tsv /tmp/first.tsv
          rm -rf results/demo data/processed/demo
          snakemake --workflow-profile none --cores 1 demo_all
          diff /tmp/first.tsv results/demo/cv_folds.tsv
      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            results/demo/
            results/tables/environment_check.txt
