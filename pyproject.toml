[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoimmune-mo"
version = "0.1.0"
description = "Multi-omics and explainable ML for pre-clinical autoimmune disease"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C4", "UP", "PERF", "BLE"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
