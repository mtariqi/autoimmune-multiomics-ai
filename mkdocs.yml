site_name: Autoimmune Multi-Omics AI
site_description: Multi-omics and explainable AI for the pre-clinical phase of autoimmune disease
site_url: https://mtariqi.github.io/autoimmune-multiomics-ai/
repo_url: https://github.com/mtariqi/autoimmune-multiomics-ai
repo_name: mtariqi/autoimmune-multiomics-ai
docs_dir: docs
strict: true

# The manuscript and grant stay out of the public site.
exclude_docs: |
  manuscript/
  grant/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data standards: data-standards.md
  - Reproducibility: reproducibility.md
  - Methods:
      - Metabolomics: methods/metabolomics.md
      - Bulk RNA-seq: methods/rnaseq.md
      - Single-cell RNA-seq: methods/scrnaseq.md
      - Microbiome: methods/microbiome.md
      - Multi-omics integration: methods/integration.md
      - Machine learning: methods/machine-learning.md
      - Explainable AI: methods/explainable-ai.md
      - Network biology: methods/network.md
      - Mendelian randomization: methods/mendelian-randomization.md
  - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
