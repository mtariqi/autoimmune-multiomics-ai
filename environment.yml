name: autoimmune-mo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - statsmodels
  - scikit-learn
  - lifelines
  - networkx
  - lightgbm
  - xgboost
  - shap
  - scanpy
  - matplotlib
  - seaborn
  - pyyaml
  - snakemake-minimal>=8.20,<9
  - pytest
  - ruff
  - black
  - jupyterlab
  - mkdocs>=1.6,<2
  - mkdocs-material>=9.5,<10
  # R side, for Mendelian randomization (TwoSampleMR is installed from GitHub; see docs/methods)
  - r-base=4.3
  - r-devtools
  - r-data.table
  - pip:
      - celltypist
      - mofapy2
